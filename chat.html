<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>چت — سایت کلاس</title><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="https://cdn.plyr.io/3.8.4/plyr.css"></head><body><div class="aurora"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div><main style="max-width:1080px"><div class="chat-layout"><div class="glass chat-sidebar"><button id="btn-group" class="active">چت گروهی</button><hr style="border-color:var(--glass-border);margin:10px 0"><p style="font-size:12px;color:var(--text-muted)">چت خصوصی</p><div id="contacts-list"></div></div><div class="glass chat-main"><h3 id="chat-title" style="margin-top:0">چت گروهی کلاس</h3><div class="chat-messages" id="messages"></div><div class="chat-input-row" id="input-row"><input type="text" id="msg-input" placeholder="پیامت رو بنویس... (برای ربات: /بات سوالت)"><button class="btn btn-primary" id="send-btn">ارسال</button><button class="btn btn-ghost" id="img-btn" title="ارسال فایل">📎</button><button class="btn btn-ghost" id="voice-btn" title="پیام صوتی">🎙</button><input type="file" id="img-input" accept="image/*,video/*,audio/*,.pdf" style="display:none"></div><p id="sending-note" style="font-size:12px;color:var(--text-muted);display:none"></p></div></div></main><script src="assets/js/api.js?v=20260925-media9"></script><script src="https://cdn.plyr.io/3.8.4/plyr.js"></script><script>
let currentUser=null,mode='group',activeContactId=null,pollTimer=null;const $=id=>document.getElementById(id);const esc=s=>{const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML;};function setSending(on,text='در حال ارسال...'){$('sending-note').textContent=text;$('sending-note').style.display=on?'block':'none';}function showError(m){setSending(true,m||'خطایی رخ داد.');}
requirePageLogin('chat.html').then(async user=>{if(!user)return;currentUser=user;try{const d=await api.getContacts();renderContacts(d.contacts||[]);startPolling();}catch(e){showError(e.message);}});function renderContacts(c){$('contacts-list').innerHTML=c.map(x=>`<button data-id="${x.id}" data-name="${esc(x.display_name)}">${esc(x.display_name)}</button>`).join('');document.querySelectorAll('#contacts-list button').forEach(b=>b.addEventListener('click',()=>switchToPrivate(Number(b.dataset.id),b.dataset.name)));}function switchToGroup(){mode='group';activeContactId=null;$('chat-title').textContent='چت گروهی کلاس';$('btn-group').classList.add('active');document.querySelectorAll('#contacts-list button').forEach(b=>b.classList.remove('active'));loadMessages();}function switchToPrivate(id,name){mode='private';activeContactId=id;$('chat-title').textContent=`پی‌وی با ${name}`;$('btn-group').classList.remove('active');document.querySelectorAll('#contacts-list button').forEach(b=>b.classList.toggle('active',Number(b.dataset.id)===id));loadMessages();}$('btn-group').addEventListener('click',switchToGroup);async function loadMessages(){try{const d=mode==='group'?await api.getGroupMessages():await api.getPrivateMessages(activeContactId);renderMessages(d.messages||[]);}catch(e){showError(e.message);}}function renderMessages(messages){$('messages').innerHTML=messages.map(m=>{const mine=Number(m.sender_id)===currentUser.id;return `<div class="msg ${mine?'mine':'theirs'}"><div class="sender">${esc(m.display_name||'')}</div><div class="bubble">${m.media_url?renderChatMedia(m):''}${m.content?esc(m.content):''}</div></div>`}).join('');$('messages').scrollTop=$('messages').scrollHeight;if(window.Plyr)$('messages').querySelectorAll('.js-player').forEach(el=>new Plyr(el,{controls:['play-large','play','progress','current-time','mute','volume','settings','pip','fullscreen'],settings:['speed','loop']}));}function renderChatMedia(m){const u=esc(m.media_url),name=esc(m.filename||'فایل'),t=m.media_type||'';if(t==='image')return `<img onerror="this.style.display='none'" src="${u}" alt="${name}" style="max-width:320px;max-height:420px;border-radius:12px;display:block;margin-bottom:8px" loading="lazy">`;if(t==='audio')return `<audio class="js-player" controls preload="metadata" src="${u}" style="display:block;margin-bottom:8px"></audio>`;if(t==='video')return `<video class="js-player" controls playsinline preload="metadata" src="${u}" style="max-width:360px;max-height:460px;border-radius:12px;display:block;margin-bottom:8px"></video>`;if(t==='pdf')return `<iframe src="${u}" title="${name}" style="width:360px;height:460px;border:0;border-radius:12px;background:#fff;display:block;margin-bottom:8px"></iframe>`;return `<a href="${u}" target="_blank" rel="noopener">📎 ${name}</a>`;}async function sendMessage(){const text=$('msg-input').value.trim();if(!text||(mode==='private'&&!activeContactId))return;setSending(true);try{await api.sendMessage({chat_type:mode,recipient_id:mode==='private'?activeContactId:undefined,content:text});$('msg-input').value='';await loadMessages();}catch(e){showError(e.message);}finally{setSending(false);}}$('send-btn').addEventListener('click',sendMessage);$('msg-input').addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage();});function startPolling(){loadMessages();pollTimer=setInterval(loadMessages,3000);}$('img-btn').addEventListener('click',()=>{if(mode==='private'&&!activeContactId){showError('اول یک مخاطب خصوصی را انتخاب کن.');return;}$('img-input').click();});$('img-input').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;setSending(true,'در حال آپلود فایل به Google Drive… 0%');try{const r=await api.uploadFile(file,p=>setSending(true,`در حال آپلود فایل به Google Drive… ${p}%`));await api.sendMessage({chat_type:mode,recipient_id:mode==='private'?activeContactId:undefined,media_url:r.directLink,media_type:file.type.startsWith('image/')?'image':file.type.startsWith('video/')?'video':file.type.startsWith('audio/')?'audio':file.type==='application/pdf'?'pdf':'file',filename:file.name});await loadMessages();}catch(err){showError(err.message);}finally{setSending(false);e.target.value='';}});let mediaRecorder=null,audioChunks=[],isRecording=false;$('voice-btn').addEventListener('click',async()=>{if(mode==='private'&&!activeContactId){showError('اول یک مخاطب خصوصی را انتخاب کن.');return;}if(isRecording){mediaRecorder.stop();isRecording=false;$('voice-btn').textContent='🎙';return;}if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){showError('برای ضبط ویس، سایت باید با HTTPS باز شود.');return;}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const mimeType=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm';mediaRecorder=new MediaRecorder(stream,{mimeType});audioChunks=[];mediaRecorder.ondataavailable=e=>{if(e.data?.size)audioChunks.push(e.data)};mediaRecorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(audioChunks,{type:mimeType});if(!blob.size)return;const file=new File([blob],`voice_${Date.now()}.webm`,{type:mimeType});setSending(true,'در حال آپلود ویس به Google Drive… 0%');try{const r=await api.uploadFile(file,p=>setSending(true,`در حال آپلود ویس به Google Drive… ${p}%`));await api.sendMessage({chat_type:mode,recipient_id:mode==='private'?activeContactId:undefined,media_url:r.directLink,media_type:'audio',filename:file.name});await loadMessages();}catch(err){showError(err.message);}finally{setSending(false);}};mediaRecorder.start(250);isRecording=true;$('voice-btn').textContent='⏹';setSending(true,'در حال ضبط ویس... برای پایان دوباره روی ⏹ بزن.');}catch(err){showError(err.message);}});</script></body></html>

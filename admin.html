<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل ادمین — سایت کلاس</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="aurora"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<main style="max-width:760px;">
  <h1>پنل ادمین 🛡</h1>

  <h3>مدیریت نقش‌ها</h3>
  <div class="glass card">
    <table>
      <thead><tr><th>کاربر</th><th>نقش فعلی</th><th>تغییر</th></tr></thead>
      <tbody id="users-body"></tbody>
    </table>
  </div>

  <h3 style="margin-top:26px;">مدیریت کلیدهای API</h3>
  <div class="glass card">
    <p style="font-size:12px; color:var(--text-muted); margin-top:0;">تا ۳ کلید می‌تونی اضافه کنی. یکی‌شون رو می‌تونی به‌عنوان «دستیار خودت» (پشتیبانی سایت + کنترل بچه‌ها) مشخص کنی.</p>
    <div id="keys-list"></div>

    <div id="new-key-form" style="margin-top:14px; padding-top:14px; border-top:1px solid var(--glass-border);">
      <div class="row">
        <div class="field"><input id="new-key-label" placeholder="اسم مستعار (مثلا: دروس عمومی)"></div>
        <div class="field"><input id="new-key-value" class="mono" placeholder="مقدار کلید API" style="direction:ltr;"></div>
      </div>
      <div class="field">
        <label>این کلید برای چیه؟</label>
        <select id="new-key-role">
          <option value="assistant">🎧 پشتیبانی سایت / دستیار من برای کنترل بچه‌ها</option>
          <option value="chatbot">🤖 چت‌بات توی چت گروهی (با /بات صداش می‌زنن)</option>
          <option value="coding">💻 دستیار پیش‌فرض بخش کدنویسی</option>
        </select>
      </div>
      <button class="btn btn-primary" id="add-key-btn">افزودن کلید</button>
    </div>

    <label style="display:flex; align-items:center; gap:8px; margin-top:18px;">
      <input type="checkbox" id="shared-memory-toggle" style="width:auto;">
      توی بخش «دروس»، همهٔ کلیدها یه حافظهٔ مشترک داشته باشن
    </label>
  </div>
</main>

<script src="assets/js/api.js"></script>
<script>
  requirePageRole('admin.html', ['admin']).then((user) => {
    if (user) { loadUsers(); loadKeys(); }
  });

  async function loadUsers() {
    const data = await api.getAllUsers();
    document.getElementById('users-body').innerHTML = data.users.map((u) => `
      <tr>
        <td>${u.display_name}</td>
        <td>${roleLabel(u.role)}</td>
        <td>
          <select data-user-id="${u.id}" class="role-select">
            <option value="student" ${u.role === 'student' ? 'selected' : ''}>دانش‌آموز</option>
            <option value="special" ${u.role === 'special' ? 'selected' : ''}>نقش ویژه</option>
            <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>ادمین</option>
          </select>
        </td>
      </tr>
    `).join('');

    document.querySelectorAll('.role-select').forEach((sel) => {
      sel.addEventListener('change', async () => {
        await api.setUserRole(Number(sel.dataset.userId), sel.value);
        loadUsers();
      });
    });
  }

  function roleLabel(role) {
    return { student: '<span class="badge violet">دانش‌آموز</span>', special: '<span class="badge gold">نقش ویژه</span>', admin: '<span class="badge emerald">ادمین</span>' }[role] || role;
  }

  async function loadKeys() {
    const data = await api.getSiteApiKeys();
    const roleLabels = { assistant: '🎧 پشتیبانی', chatbot: '🤖 چت‌بات', coding: '💻 کدنویسی' };
    document.getElementById('keys-list').innerHTML = data.keys.map((k) => `
      <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--glass-border);">
        <span>${k.label} <span class="badge violet">${roleLabels[k.key_role] || k.key_role}</span></span>
        <span class="mono">••••${k.last_four}</span>
      </div>
    `).join('') || '<p style="color:var(--text-disabled); font-size:13px;">هنوز کلیدی اضافه نشده.</p>';

    document.getElementById('shared-memory-toggle').checked = data.sharedMemory;

    if (data.keys.length >= 3) {
      document.getElementById('new-key-form').style.display = 'none';
    }
  }

  document.getElementById('add-key-btn').addEventListener('click', async () => {
    const label = document.getElementById('new-key-label').value.trim();
    const api_key = document.getElementById('new-key-value').value.trim();
    const key_role = document.getElementById('new-key-role').value;
    const errorEl = document.getElementById('key-error') || (() => {
      const p = document.createElement('p');
      p.id = 'key-error';
      p.className = 'error-text';
      document.getElementById('new-key-form').appendChild(p);
      return p;
    })();
    errorEl.style.display = 'none';
    if (!label || !api_key) return;
    try {
      await api.saveSiteApiKey({ label, api_key, key_role });
      document.getElementById('new-key-label').value = '';
      document.getElementById('new-key-value').value = '';
      loadKeys();
    } catch (e) {
      errorEl.textContent = e.message;
      errorEl.style.display = 'block';
    }
  });

  document.getElementById('shared-memory-toggle').addEventListener('change', async (e) => {
    await api.setSharedMemory(e.target.checked);
  });
</script>
</body>
</html>

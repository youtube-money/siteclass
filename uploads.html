<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>آپلودها — سایت کلاس</title><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="https://cdn.plyr.io/3.8.4/plyr.css"><style>.upload-library{display:grid;gap:14px}.file-card{padding:14px;border:1px solid var(--glass-border);border-radius:18px;background:rgba(255,255,255,.035)}.file-card .meta{font-size:12px;color:var(--text-muted);margin:6px 0 10px}.file-preview{width:100%;max-height:420px;border:0;border-radius:14px;background:#050609;object-fit:contain}.file-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.upload-box{padding:22px;border-radius:20px}.progress{height:10px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-top:14px;display:none}.progress.show{display:block}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#7c3aed,#06b6d4);transition:width .15s}.upload-status{font-size:13px;color:var(--text-muted);margin-top:10px}</style></head><body><div class="aurora"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div><main style="max-width:700px"><h1>آپلود فایل</h1><p style="color:var(--text-muted);font-size:14px">فایل‌های سنگین مستقیم به Google Drive کلاس می‌روند؛ روی فضای هاست ذخیره نمی‌شوند.</p><div class="glass upload-box"><input type="file" id="file-input" accept="image/*,video/*,audio/*,.pdf,.txt,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.rar"><button class="btn btn-primary" id="upload-btn" style="margin-inline-start:10px">آپلود کن</button><div class="progress" id="progress"><div id="progress-bar"></div></div><div class="upload-status" id="status"></div><p class="error-text" id="error-msg" style="display:none;margin-top:10px"></p></div><h3>فایل‌های آپلودشده</h3><section id="uploads-list" class="upload-library"><p style="color:var(--text-muted)">در حال بارگذاری…</p></section></main><script src="assets/js/api.js?v=20260925-media9"></script><script src="https://cdn.plyr.io/3.8.4/plyr.js"></script><script>const esc=s=>{const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML;};const mediaUrl=u=>u.direct_link||('/api/google-file.php?id='+encodeURIComponent(u.drive_file_id||''));function renderUploadCard(u){const n=esc(u.filename||u.name||'فایل'),name=esc(u.display_name||'دانش‌آموز'),url=esc(mediaUrl(u)),ext=(u.filename||'').toLowerCase().split('.').pop();let preview='';if(['mp4','webm','ogg','mov','m4v'].includes(ext))preview='<video class="file-preview js-player" controls playsinline preload="metadata" src="'+url+'"></video>';else if(['jpg','jpeg','png','gif','webp','svg','avif'].includes(ext))preview='<img class="file-preview" loading="lazy" src="'+url+'" alt="'+n+'">';else if(['mp3','wav','m4a','aac','flac','opus'].includes(ext))preview='<audio class="file-preview js-player" controls preload="metadata" src="'+url+'"></audio>';else if(ext==='pdf')preview='<iframe class="file-preview" style="height:460px" src="'+url+'" title="'+n+'"></iframe>';return '<article class="file-card"><b>📎 '+n+'</b><div class="meta">آپلود توسط '+name+'</div>'+preview+'<div class="file-actions"><a class="btn btn-ghost" href="'+esc(u.view_link||url)+'" target="_blank" rel="noopener">باز کردن</a><a class="btn btn-ghost" href="'+url+'" target="_blank" rel="noopener">نمایش مستقیم</a></div></article>';}async function loadUploads(){try{const data=await api.getAllUploads();const list=document.getElementById('uploads-list');list.innerHTML=(data.uploads||[]).map(renderUploadCard).join('')||'<p style="color:var(--text-muted)">هنوز فایلی آپلود نشده.</p>';if(window.Plyr)list.querySelectorAll('.js-player').forEach(el=>new Plyr(el,{controls:['play-large','play','progress','current-time','mute','volume','settings','pip','fullscreen'],settings:['speed','loop']}));}catch(e){document.getElementById('uploads-list').innerHTML='<p class="error-text">بارگذاری فایل‌ها ناموفق بود: '+esc(e.message)+'</p>';console.error('SITECLASS uploads:',e);}}(async()=>{try{const user=await requirePageLogin('uploads.html');if(user)await loadUploads();}catch(e){console.error(e);}})();document.getElementById('upload-btn').addEventListener('click',async()=>{const file=document.getElementById('file-input').files[0];if(!file)return;const btn=document.getElementById('upload-btn'),err=document.getElementById('error-msg'),status=document.getElementById('status'),progress=document.getElementById('progress'),bar=document.getElementById('progress-bar');err.style.display='none';btn.disabled=true;progress.classList.add('show');bar.style.width='0%';status.textContent='در حال اتصال مستقیم به Google Drive…';try{await api.uploadFile(file,p=>{bar.style.width=p+'%';status.textContent=`در حال آپلود به Google Drive… ${p}%`;});status.textContent='آپلود با موفقیت انجام شد ✓';document.getElementById('file-input').value='';await loadUploads();}catch(e){err.textContent=e.message;err.style.display='block';status.textContent='آپلود ناموفق بود.';}finally{btn.disabled=false;setTimeout(()=>progress.classList.remove('show'),1200);}});</script></body></html>

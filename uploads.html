<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>آپلودها — سایت کلاس</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="https://cdn.plyr.io/3.8.4/plyr.css">
<style>.upload-library{display:grid;gap:14px}.file-card{padding:14px;border:1px solid var(--glass-border);border-radius:18px;background:rgba(255,255,255,.035)}.file-card .meta{font-size:12px;color:var(--text-muted);margin:6px 0 10px}.file-preview{width:100%;max-height:420px;border:0;border-radius:14px;background:#050609;object-fit:contain}.file-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.upload-box{padding:22px;border-radius:20px}.progress{height:10px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-top:14px;display:none}.progress.show{display:block}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#7c3aed,#06b6d4);transition:width .15s}.upload-status{font-size:13px;color:var(--text-muted);margin-top:10px}</style>
</head>
<body><div class="aurora"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<main style="max-width:700px"><h1>آپلود فایل</h1><p style="color:var(--text-muted);font-size:14px">فایل‌های سنگین مستقیم به Google Drive کلاس می‌روند؛ روی فضای هاست ذخیره نمی‌شوند.</p>
<div class="glass upload-box"><input type="file" id="file-input"><button class="btn btn-primary" id="upload-btn" style="margin-inline-start:10px">آپلود کن</button><div class="progress" id="progress"><div id="progress-bar"></div></div><div class="upload-status" id="status"></div><p class="error-text" id="error-msg" style="display:none;margin-top:10px"></p></div>
<h3>فایل‌های آپلودشده</h3><section id="uploads-list" class="upload-library"></section></main>
<script src="assets/js/api.js?v=20260925-drive5"></script><script src="https://cdn.plyr.io/3.8.4/plyr.js"></script><script>
requirePageLogin('uploads.html').then(user=>{if(user)loadUploads();});
async function loadUploads(){try{const data=await api.getAllUploads();document.getElementById('uploads-list').innerHTML=(data.uploads||[]).map(renderUploadCard).join('')||'<p style="color:var(--text-muted)">هنوز فایلی آپلود نشده.</p>'; document.querySelectorAll('.js-player').forEach(el=>new Plyr(el,{controls:['play-large','play','progress','current-time','mute','volume','settings','pip','fullscreen'],settings:['speed','loop']}));}catch(e){document.getElementById('uploads-list').innerHTML=`<p class="error-text">${escapeHtml(e.message)}</p>`;}}
function renderUploadCard(u){const n=escapeHtml(u.filename||'فایل'),name=escapeHtml(u.display_name||'دانش‌آموز'),url=escapeHtml(u.direct_link||u.view_link),ext=(u.filename||'').toLowerCase().split('.').pop();let preview='';if(['mp4','webm','ogg','mov'].includes(ext))preview='<video class="file-preview js-player" playsinline preload="metadata" src="'+url+'"></video>';else if(['jpg','jpeg','png','gif','webp','svg'].includes(ext))preview='<img class="file-preview" src="'+url+'" alt="'+n+'">';else if(ext==='pdf')preview='<iframe class="file-preview" style="height:460px" src="'+url+'" title="'+n+'"></iframe>';return '<article class="file-card"><b>📎 '+n+'</b><div class="meta">آپلود توسط '+name+'</div>'+preview+'<div class="file-actions"><a class="btn btn-ghost" href="'+escapeHtml(u.view_link)+'" target="_blank" rel="noopener">باز کردن</a><a class="btn btn-ghost" href="'+url+'" target="_blank" rel="noopener">نمایش مستقیم</a></div></article>';}function escapeHtml(s){const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML;}
document.getElementById('upload-btn').addEventListener('click',async()=>{const file=document.getElementById('file-input').files[0];if(!file)return;const btn=document.getElementById('upload-btn'),err=document.getElementById('error-msg'),status=document.getElementById('status'),progress=document.getElementById('progress'),bar=document.getElementById('progress-bar');err.style.display='none';btn.disabled=true;progress.classList.add('show');bar.style.width='0%';status.textContent='در حال اتصال مستقیم به Google Drive…';try{await api.uploadFile(file,p=>{bar.style.width=p+'%';status.textContent=`در حال آپلود به Google Drive… ${p}%`;});status.textContent='آپلود با موفقیت انجام شد ✓';document.getElementById('file-input').value='';await loadUploads();}catch(e){err.textContent=e.message;err.style.display='block';status.textContent='آپلود ناموفق بود.';}finally{btn.disabled=false;btn.textContent='آپلود کن';setTimeout(()=>{progress.classList.remove('show');},1200);}});
</script></body></html>

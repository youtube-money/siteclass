<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حدس عدد</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #060714; color: #f8fafc; font-family: sans-serif;
  }
  .card {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14); border-radius: 20px;
    padding: 36px; text-align: center; width: 320px;
  }
  h1 { margin: 0 0 8px; font-size: 20px; }
  p.sub { color: #94a3b8; font-size: 13px; margin: 0 0 20px; }
  input {
    width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.04); color: #f8fafc; font-size: 16px; text-align: center; margin-bottom: 12px;
  }
  button {
    width: 100%; padding: 12px; border-radius: 12px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #8b5cf6, #06b6d4); color: white; font-weight: bold; font-size: 15px;
  }
  #hint { margin-top: 16px; font-size: 14px; min-height: 20px; }
  #attempts { color: #64748b; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<div class="card">
  <h1>🎯 حدس عدد</h1>
  <p class="sub">یه عدد بین ۱ تا ۱۰۰ رو حدس بزن</p>
  <input type="number" id="guess-input" min="1" max="100" placeholder="عددت رو بنویس">
  <button id="guess-btn">حدس بزن</button>
  <div id="hint"></div>
  <div id="attempts"></div>
</div>

<script>
  let target, attempts;

  function newGame() {
    target = Math.floor(Math.random() * 100) + 1;
    attempts = 0;
    document.getElementById('hint').textContent = '';
    document.getElementById('attempts').textContent = '';
    document.getElementById('guess-input').value = '';
    document.getElementById('guess-input').disabled = false;
    document.getElementById('guess-btn').textContent = 'حدس بزن';
    document.getElementById('guess-btn').onclick = handleGuess;
  }

  function handleGuess() {
    const input = document.getElementById('guess-input');
    const value = Number(input.value);
    if (!value || value < 1 || value > 100) return;

    attempts++;
    document.getElementById('attempts').textContent = 'تعداد حدس‌ها: ' + attempts;

    if (value === target) {
      document.getElementById('hint').textContent = '🎉 آفرین! درست حدس زدی!';
      document.getElementById('hint').style.color = '#34d399';
      input.disabled = true;
      document.getElementById('guess-btn').textContent = 'بازی جدید';
      document.getElementById('guess-btn').onclick = newGame;
      const score = Math.max(10, 100 - (attempts - 1) * 10);
      submitScore('number-guess', score);
    } else if (value < target) {
      document.getElementById('hint').textContent = '⬆️ بزرگ‌تره';
      document.getElementById('hint').style.color = '#fbbf24';
    } else {
      document.getElementById('hint').textContent = '⬇️ کوچیک‌تره';
      document.getElementById('hint').style.color = '#fbbf24';
    }
  }

  document.getElementById('guess-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('guess-btn').click();
  });

  function submitScore(gameKey, scoreValue) {
    fetch('/api/game-score-submit.php', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ game_key: gameKey, score: scoreValue }),
    }).catch(() => {});
  }

  newGame();
</script>
</body>
</html>

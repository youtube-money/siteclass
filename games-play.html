<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بازی — سایت کلاس</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="aurora"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<main>
  <div id="content"></div>
</main>

<script src="assets/js/api.js"></script>
<script>
  requirePageLogin('games.html').then(async (user) => {
    if (!user) return;
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    if (!id) return;

    try {
      const data = await api.getStudentGame(id);
      const g = data.game;
      document.getElementById('content').innerHTML = `
        <h1>${g.title}</h1>
        ${g.description ? `<p>${g.description}</p>` : ''}
        <p style="font-size:12px; color:var(--text-disabled);">ساختهٔ ${g.display_name}</p>
        <iframe id="game-frame" sandbox="allow-scripts"
          style="width:100%; height:70vh; border:1px solid rgba(255,255,255,0.14); border-radius:12px; margin-top:12px;"></iframe>
      `;
      const frame = document.getElementById('game-frame');
      if (g.file_link) {
        // بازی آپلودشده — از طریق پراکسی سرور لود می‌شه (نه srcdoc)
        frame.src = `/api/game-file-proxy.php?id=${id}`;
      } else {
        // بازی با کد پیست‌شده — با srcdoc بدون دسترسی به کوکی/localStorage سایت اصلی اجرا می‌شه
        frame.srcdoc = g.html_content;
      }

      // بازی داخل iframe به کوکی/شبکهٔ سایت دسترسی نداره (عمدیه، برای امنیت)
      // پس امتیاز رو با postMessage به همین صفحه می‌فرسته، و اینجا با session خودمون ذخیره‌اش می‌کنیم
      window.addEventListener('message', async (event) => {
        if (!event.data || event.data.type !== 'game-score') return;
        const score = Number(event.data.score);
        if (!Number.isFinite(score) || score < 0) return;
        try {
          await api.submitGameScore(`student:${id}`, score);
        } catch (e) {
          // اگه ذخیره نشد، بازی رو مختل نکن
        }
      });
    } catch (e) {
      document.getElementById('content').innerHTML = `<p style="color:var(--coral-400)">${e.message}</p>`;
    }
  });
</script>
</body>
</html>
